name: Tidy filenames (one time)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cleanup.yml
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip numeric upload prefixes
        run: |
          for f in [0-9]*-*; do
            [ -f "$f" ] || continue
            mv -f "$f" "${f#*-}"
          done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Tidy filenames" || echo "nothing to commit"
          git push
